[project]
name = "omnicard-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1", "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3", "pwdlib[argon2]>=0.2,<1", "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1", "pillow>=11,<13",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
