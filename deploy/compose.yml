name: omnicard

x-server: &server
  build: ../backend
  environment: &environment
    OMNICARD_DATABASE_URL: postgresql+psycopg://omnicard:${DB_PASSWORD:?Set a random hex DB_PASSWORD in .env}@db/omnicard
    OMNICARD_DATA_DIR: /data
    OMNICARD_ORIGIN: ${APP_ORIGIN:?Set the exact HTTPS origin in .env}
    OMNICARD_COOKIE_SECURE: "true"
    OMNICARD_OLLAMA_URL: http://host.docker.internal:11434
    OMNICARD_EMBEDDING_MODEL: bge-m3:latest
    OMNICARD_EMBEDDING_DIGEST: ${EMBEDDING_DIGEST:?Pin bge-m3 digest from Ollama api/tags}
    OMNICARD_OCR_MODEL: glm-ocr:latest
  volumes:
    - images:/data
  extra_hosts:
    - host.docker.internal:host-gateway
  restart: unless-stopped

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: omnicard
      POSTGRES_USER: omnicard
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnicard -d omnicard"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  migrate:
    <<: *server
    restart: "no"
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    <<: *server
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    <<: *server
    command: ["uv", "run", "--no-sync", "python", "-m", "app.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    ports:
      - "127.0.0.1:8090:8080"
    depends_on: [api]
    restart: unless-stopped

volumes:
  database:
  images:
