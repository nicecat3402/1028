server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index onprem.html;
    client_max_body_size 13m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location /api/ {
        proxy_pass http://api:8091;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering on;
        # Avoid writing query text / personal data to ordinary web access logs.
        access_log off;
    }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri /onprem.html; }
}
